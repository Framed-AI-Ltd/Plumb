version: 2
updates:
  - package-ecosystem: npm
    cooldown:
      default-days: 7
    directory: /
    target-branch: develop
    # Keep Node types on the runtime major; revisit when .nvmrc changes.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    cooldown:
      default-days: 7
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
