name: PR visual comparison
on:
  pull_request:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-source
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          package-manager-cache: false
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm install --frozen-lockfile && pnpm build:storybook
        working-directory: base-source
      - name: Capture base using the same harness
        run: |
          cp -R base-source/storybook-static storybook-static
          VISUAL_CAPTURE_ONLY=1 pnpm test:visual
          mv test-results visual-base
      - name: Capture proposed head
        run: |
          pnpm build:storybook
          VISUAL_CAPTURE_ONLY=1 pnpm test:visual
          mv test-results visual-head
      - name: Generate comparison evidence
        run: node tools/visual-diff.mjs visual-base visual-head
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pr-visual-comparison
          path: |
            visual-diff/
            visual-base/
            visual-head/
            playwright-report/
          retention-days: 14
