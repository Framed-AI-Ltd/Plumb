name: CI

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.impact.outputs.ui }}
      scope: ${{ steps.impact.outputs.scope }}
      story_files: ${{ steps.impact.outputs.story_files }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc
      - id: impact
        name: Select conservative UI coverage
        run: node tools/ci-impact.mjs
      - run: pnpm install --frozen-lockfile
      - name: Tokens, contrast, palette, i18n, types, lint, tests, catalogue
        run: pnpm check
      - name: Generated files are committed
        run: git diff --exit-code -- src/styles/tokens.css src/lib/theme/tokens.stylex.ts docs/PALETTE.md
      - name: Review feedback declaration
        if: github.event_name == 'pull_request'
        run: node tools/verify-review-feedback.mjs "$GITHUB_EVENT_PATH"
      - name: Review risk classifier
        run: node --test tools/review-risk.test.mjs
      - name: Packed package consumer smoke
        run: pnpm package:smoke

  accessibility:
    if: needs.check.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    needs: check
    timeout-minutes: 30
    env:
      CI_UI_SCOPE: ${{ needs.check.outputs.scope }}
      CI_STORY_FILES: ${{ needs.check.outputs.story_files }}
      VISUAL_PR: '1'
      VISUAL_CAPTURE_ONLY: '1'
      VISUAL_A11Y: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build:storybook
      - name: Select stories from the built inventory
        run: node tools/ci-stories.mjs
      - name: Interaction regressions
        run: |
          pnpm test:browser
          pnpm test:calendar
      - name: Required rendering, accessibility and responsive checks with visual evidence
        run: pnpm test:visual
      - name: Advisory comparison against approved screenshots
        run: node tools/visual-diff.mjs tools/visual/snapshots test-results visual-diff --captured-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: review
          path: |
            review/
            review-interactions/
            review-calendars/
            review-responsive/
            visual-diff/
            test-results/
            playwright-report/
          retention-days: 14
