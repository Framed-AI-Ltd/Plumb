name: Publish npm
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable tag to retry without moving it
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-publication
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Framed-AI-Ltd/Plumb' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: release-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          package-manager-cache: false
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Select protected release source
        id: source
        working-directory: .
        run: node tools/release-selection.mjs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.commit }}
          path: release-source
          persist-credentials: false
      - run: npm install --global npm@11.11.0
      - name: Verify tagged package prerequisites
        run: node tools/release-guard.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm package:smoke
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser && pnpm test:calendar
      - run: pnpm build
      - name: Pack verified source without publishing
        run: pnpm pack --pack-destination release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package
          path: release-source/release/*.tgz
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      # No checkout, dependency installation or project lifecycle scripts in this job.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.11.0 --ignore-scripts
      - name: Download this run's verified tarball
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-package --dir release
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Trusted publisher (no npm token)
        shell: bash
        run: |
          archives=(./release/*.tgz)
          test "${#archives[@]}" -eq 1
          test -f "${archives[0]}"
          npm publish "${archives[0]}" --ignore-scripts --access public --provenance
