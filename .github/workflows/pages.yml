name: Storybook Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      validate_only:
        description: Build and validate the Pages artifact without deployment
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          package-manager-cache: false
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:storybook
        env:
          STORYBOOK_BASE_PATH: /Plumb/
      - run: pnpm verify:storybook
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: storybook-static
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || !inputs.validate_only)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
